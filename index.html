<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Flood Monitoring - Lokasi Pemasangan</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-content">
                <div class="system-badge">🛡️ REAL-TIME MONITORING SYSTEM</div>
                <h1>🌊 SMART FLOOD AND SURVEILLANCE </h1>
                <p class="subtitle">MONITORING SYSTEM</p>
            </div>
        </div>
        
        <div class="content">
            <div id="map">
                <div class="map-controls">
                    <div class="zoom-btn" onclick="zoomIn()">+</div>
                    <div class="zoom-level" id="zoomLevel">7</div>
                    <div class="zoom-btn" onclick="zoomOut()">−</div>
                </div>
            </div>
            
            <div class="locations-list">
                <div class="controls">
                    <button class="clear-btn" onclick="clearSelection()">🔍 Tunjuk Keseluruhan</button>
                </div>
                
                <div class="state-stats">
                    <h4>🗺️ Pilih Negeri</h4>
                    <div class="state-buttons" id="stateButtons"></div>
                </div>
                
                <h3 style="margin-top: 0; color: #333;">📍 Senarai Lokasi</h3>
                <div id="locationsList"></div>
            </div>
        </div>
        
        <div class="stats">
            <div class="stats-left">
                <span id="totalLocations">15 lokasi pemasangan</span>
                <span>•</span>
                <span id="totalStates">6 negeri</span>
                <span>•</span>
                <span style="color: #10b981; font-weight: 500;">✅ Semua Sistem Aktif</span>
            </div>
            <div class="stats-right">
                <div class="company-info">
                    <div class="developed-by">📡 Disediakan oleh CARA Technologies Sdn Bhd</div>
                    <div class="powered-by">⚡ Powered by NASADEF Sdn Bhd</div>
                </div>
                <div class="logo-container">
                    <img src="./images/cara-logo-new.png" alt="CARA Technologies Logo" onerror="this.style.display='none';" />
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script>
        // Initialize the map
        var map = L.map('map').setView([4.5, 102], 7);
        var currentZoom = 7;
        
        // Add tile layer
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);
        
        // Location data
        var locations = [
            ["Johor - Kota Tinggi - Jln Lok Heng - Sg Mas", 1.674128, 104.120837],
            ["Kedah - Kota Setar - Gunung Hilir", 6.18868, 100.3386],
            ["Kelantan - Kuala Krai - KG BELANGA", 5.483775, 102.241581],
            ["Kelantan - Kuala Krai - TKKU", 5.564771, 102.14394],
            ["Kelantan - Tanah Merah - Kg Lawang", 5.789103, 101.976087],
            ["Kelantan - Pasir Puteh - Gong Kulim", 5.83786, 102.419185],
            ["Kelantan - Pasir Mas - Repek", 6.025625, 102.093911],
            ["Kelantan - Tumpat - Terbok", 6.1849, 102.166767],
            ["Negeri Sembilan - Tampin - Felda Bukit Rokan", 2.6064, 102.4022],
            ["Pahang - Kuantan - Kg Balok", 3.93734, 103.37576],
            ["Pahang - Kecil Jelai - Sg. Koyan 2", 4.20882, 101.79642],
            ["Terengganu - Dungun - T3_0320-KG. WAWASAN", 4.69283, 103.34275],
            ["Terengganu - Dungun - Taman Rakyat Jaya", 4.745886, 103.406119],
            ["Terengganu - Kuala Terengganu - Kampung Petai Bubus", 5.33788, 103.07882],
            ["Terengganu - Besut - Kg Gong Kepas", 5.78124, 102.555]
        ];
        
        // Store markers for interaction
        var markers = {};
        
        // Add markers to map and create list
        var locationsList = document.getElementById('locationsList');
        var stateButtons = document.getElementById('stateButtons');
        
        // Count locations by state
        var stateCounts = {};
        locations.forEach(function(loc) {
            var state = loc[0].split(' - ')[0];
            stateCounts[state] = (stateCounts[state] || 0) + 1;
        });
        
        // State coordinates for zooming
        var stateCoords = {
            'Johor': [1.674128, 104.120837, 10],
            'Kedah': [6.18868, 100.3386, 10],
            'Kelantan': [5.7, 102.0, 9],
            'Negeri Sembilan': [2.6064, 102.4022, 10],
            'Pahang': [4.0, 102.5, 9],
            'Terengganu': [5.2, 103.0, 9]
        };
        
        // Zoom control functions
        function updateZoomLevel() {
            currentZoom = map.getZoom();
            document.getElementById('zoomLevel').textContent = Math.round(currentZoom);
        }
        
        function zoomIn() {
            map.zoomIn();
            updateZoomLevel();
        }
        
        function zoomOut() {
            map.zoomOut();
            updateZoomLevel();
        }
        
        // Listen to zoom events
        map.on('zoomend', updateZoomLevel);
        
        // Create state buttons
        function createStateButtons() {
            Object.keys(stateCounts).sort().forEach(function(state) {
                var button = document.createElement('div');
                button.className = 'state-btn';
                button.setAttribute('data-state', state);
                
                button.innerHTML = 
                    '<div class="state-name">' + state + '</div>' +
                    '<div class="location-count">' + stateCounts[state] + '</div>';
                
                // Add click event to zoom to state
                button.addEventListener('click', function() {
                    var coords = stateCoords[state];
                    if (coords) {
                        map.setView([coords[0], coords[1]], coords[2]);
                    }
                    
                    // Update button states
                    document.querySelectorAll('.state-btn').forEach(function(btn) {
                        btn.classList.remove('selected');
                    });
                    button.classList.add('selected');
                    
                    // Filter and highlight locations for this state
                    document.querySelectorAll('.location-item').forEach(function(item) {
                        var itemState = item.querySelector('.state-name').textContent;
                        if (itemState === state) {
                            item.style.borderLeftColor = '#10b981';
                            item.style.display = 'block';
                        } else {
                            item.style.borderLeftColor = '#e5e7eb';
                            item.style.opacity = '0.5';
                        }
                    });
                });
                
                stateButtons.appendChild(button);
            });
        }
        
        // Initialize state buttons
        createStateButtons();
        
        // Function to clear selection and show overall view
        function clearSelection() {
            map.setView([4.5, 102], 7);
            updateZoomLevel();
            document.querySelectorAll('.location-item').forEach(function(item) {
                item.style.borderLeftColor = '#2563eb';
                item.style.opacity = '1';
                item.style.display = 'block';
            });
            document.querySelectorAll('.state-btn').forEach(function(btn) {
                btn.classList.remove('selected');
            });
        }
        
        locations.forEach(function(loc, index) {
            var name = loc[0];
            var lat = loc[1];
            var lng = loc[2];
            
            // Create marker with custom popup
            var marker = L.marker([lat, lng]).addTo(map)
                .bindPopup('<div style="font-weight: bold; margin-bottom: 5px; color: #2563eb;">🌊 ' + name + '</div>' +
                          '<div style="color: #666;">📍 Lat: ' + lat + ', Lng: ' + lng + '</div>' +
                          '<div style="color: #059669; font-size: 0.9em; margin-top: 5px;">✅ Sistem Aktif</div>');
            
            markers[index] = marker;
            
            // Create list item
            var listItem = document.createElement('div');
            listItem.className = 'location-item';
            listItem.innerHTML = 
                '<div class="location-name">' + 
                '<span class="state">' + name.split(' - ')[0] + '</span> - ' +
                name.substring(name.indexOf(' - ') + 3) + 
                '</div>' +
                '<div class="location-coords">📍 ' + lat + ', ' + lng + '</div>';
            
            // Add click event to zoom to location
            listItem.addEventListener('click', function() {
                map.setView([lat, lng], 12);
                marker.openPopup();
                
                // Highlight selected item
                document.querySelectorAll('.location-item').forEach(function(item) {
                    item.style.borderLeftColor = '#2563eb';
                });
                listItem.style.borderLeftColor = '#ef4444';
            });
            
            locationsList.appendChild(listItem);
        });
        
        // Update stats
        var states = [...new Set(locations.map(loc => loc[0].split(' - ')[0]))];
        document.getElementById('totalStates').textContent = states.length + ' negeri';
        document.getElementById('totalLocations').textContent = locations.length + ' lokasi pemasangan';
    </script>
</body>
</html>
